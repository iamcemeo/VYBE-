<title>VYBE — Music for your mood</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#14141b;--panel2:#1c1b25;--text:#f7f5fb;--muted:#9b98a8;--accent:#a78bfa;--accent2:#7c3aed;--line:#292733;--good:#8be0b2;--danger:#ff8795}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding-bottom:calc(150px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 80% -10%,#302052 0,transparent 42%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 26px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.22em;font-size:21px}.brandmark{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#c4b5fd,#7c3aed);display:grid;place-items:center;color:#100b1e;font-size:16px;box-shadow:0 5px 22px #8b5cf655}.avatar{width:38px;height:38px;border-radius:50%;background:#282333;color:#d8cafa;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.hello{font-size:28px;line-height:1.12;margin:7px 0 18px;letter-spacing:-.04em}.section{margin:27px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.02em}.subtle{color:var(--muted);font-size:13px}.linkbtn{background:none;color:var(--accent);font-size:13px;font-weight:700;padding:7px}.hero{position:relative;overflow:hidden;min-height:190px;border-radius:24px;padding:22px;background:linear-gradient(115deg,#33215c,#171323 65%,#20152e);display:flex;align-items:end;box-shadow:0 16px 45px #0005}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(1px)}.hero:before{width:190px;height:190px;right:-30px;top:-45px;background:radial-gradient(circle at 35% 35%,#e9d5ff,#9b5de5 25%,#542e85 58%,transparent 70%);opacity:.85}.hero:after{width:150px;height:150px;right:60px;top:55px;background:radial-gradient(circle,#a78bfa66,transparent 68%)}.hero>*{position:relative;z-index:1}.hero h2{font-size:27px;max-width:240px;margin:7px 0 8px;letter-spacing:-.04em}.pill{border-radius:999px;padding:8px 13px;background:#ffffff18;color:#fff;font-size:12px;font-weight:700}.hero .pill{background:#d9c7ff;color:#24133d}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quick{background:#ffffff0b;border:1px solid #ffffff0b;border-radius:12px;display:flex;align-items:center;gap:10px;padding:9px;text-align:left;min-width:0}.quick .cover{width:46px;height:46px;flex:none}.quick span{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cover{border-radius:11px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#6d28d9,#171323);color:#fff;font-size:21px;flex:none;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff22,transparent 55%);pointer-events:none}.cover img{width:100%;height:100%;object-fit:cover}.cards{display:flex;gap:13px;overflow:auto;padding:1px 1px 8px;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}.album{width:136px;flex:none;text-align:left;background:none;padding:0}.album .cover{width:136px;height:136px;border-radius:16px;margin-bottom:9px;font-size:36px}.album strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album small{color:var(--muted);font-size:11px}.rowlist{display:grid;gap:4px}.trackrow{display:flex;align-items:center;gap:11px;padding:8px 5px;border-radius:13px;min-width:0}.trackrow:active,.quick:active{background:#ffffff12}.trackrow .cover{width:48px;height:48px}.trackmeta{min-width:0;flex:1}.trackmeta strong,.trackmeta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trackmeta strong{font-size:13px}.trackmeta small{font-size:11px;color:var(--muted);margin-top:4px}.iconbtn{background:transparent;color:#bdb8ca;padding:9px;border-radius:50%;font-size:17px;min-width:36px}.iconbtn.active{color:var(--accent)}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#111117ed;backdrop-filter:blur(24px);border-top:1px solid #ffffff12;padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{background:none;color:#8e899a;display:grid;gap:4px;justify-items:center;font-size:10px;min-width:62px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:var(--accent)}.mini{position:fixed;z-index:19;bottom:calc(70px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:740px;margin:auto;background:#25212eeb;backdrop-filter:blur(20px);border:1px solid #ffffff18;border-radius:15px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px #0008}.mini .cover{width:42px;height:42px}.mini .trackmeta strong{font-size:12px}.mini .trackmeta small{font-size:10px}.mini button{background:none;padding:7px;font-size:19px}.mini-progress{height:2px;background:#ffffff20;position:absolute;bottom:0;left:10px;right:10px;border-radius:2px;overflow:hidden}.mini-progress i{display:block;height:100%;background:var(--accent);width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 19px}.pagehead h1{font-size:29px;margin:0;letter-spacing:-.04em}.searchbox{display:flex;gap:10px;align-items:center;background:var(--panel);padding:13px 15px;border-radius:14px;margin:14px 0}.searchbox input{border:0;outline:0;background:none;color:white;width:100%;font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.chip{background:#ffffff0c;border:1px solid #ffffff12;color:#c7c1d1;border-radius:999px;padding:9px 14px;font-size:12px;white-space:nowrap}.chip.active{background:#a78bfa25;border-color:#a78bfa66;color:#d9c7ff}.empty{padding:35px 18px;text-align:center;border:1px dashed #ffffff24;border-radius:18px;color:var(--muted)}.empty .big{font-size:32px;margin-bottom:10px}.primary{background:linear-gradient(135deg,#b9a0ff,#8b5cf6);color:#170e28;font-weight:800;border-radius:999px;padding:12px 17px}.secondary{background:#ffffff12;border:1px solid #ffffff12;color:#eee;border-radius:999px;padding:11px 15px;font-weight:700}.danger{color:var(--danger)}.playerpage{position:fixed;z-index:30;inset:0;background:radial-gradient(ellipse at 50% 15%,#4b2b78,#17131f 48%,#09090d 100%);padding:calc(18px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));display:none;overflow:auto}.playerpage.open{display:flex;flex-direction:column}.playerbar{display:flex;justify-content:space-between;align-items:center}.playerart{width:min(78vw,390px);aspect-ratio:1;margin:35px auto 28px;border-radius:22px;box-shadow:0 24px 60px #0009;font-size:100px}.playerart .cover{width:100%;height:100%;border-radius:22px}.playerinfo{display:flex;align-items:center;gap:12px}.playerinfo .trackmeta strong{font-size:22px}.playerinfo .trackmeta small{font-size:14px}.seek{width:100%;accent-color:var(--accent);margin:22px 0 4px}.times{display:flex;justify-content:space-between;color:#b5afc2;font-size:11px}.controls{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.controls .play{width:66px;height:66px;border-radius:50%;background:#f7f3ff;color:#20152e;font-size:25px}.controls .iconbtn{font-size:22px}.volume{display:flex;align-items:center;gap:12px;color:#bdb8ca}.volume input{flex:1;accent-color:var(--accent)}.modalback{position:fixed;z-index:50;inset:0;background:#0009;display:none;align-items:end;justify-content:center;padding:12px}.modalback.open{display:flex}.modal{width:100%;max-width:560px;background:#1b1922;border:1px solid #ffffff1b;border-radius:22px;padding:20px;max-height:85vh;overflow:auto}.modal h2{margin:0 0 15px}.field{width:100%;background:#0f0e14;border:1px solid #ffffff20;border-radius:12px;padding:13px;color:#fff;margin:7px 0 14px}.settingsrow{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);gap:12px}.settingsrow small{display:block;color:var(--muted);margin-top:4px}.settingsrow select{background:#24212d;color:white;border:1px solid #ffffff20;border-radius:9px;padding:8px}.toast{position:fixed;z-index:70;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8dcff;color:#211532;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:800;display:none;white-space:nowrap;box-shadow:0 8px 24px #0007}.toast.show{display:block}.hidden{display:none!important}
@media(min-width:650px){.app{padding-top:28px}.hero{min-height:220px}.quickgrid{grid-template-columns:repeat(4,1fr)}.mini{bottom:82px}.nav{max-width:760px;left:50%;transform:translateX(-50%);border:1px solid #ffffff16;border-bottom:0;border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span class="brandmark">V</span> VYBE</div><button class="avatar" id="settingsAvatar" aria-label="Settings">V</button></header>
  <main id="view"></main>
</div>
<div class="mini hidden" id="miniPlayer" role="button" aria-label="Open now playing">
  <div class="cover" id="miniArt">♫</div><div class="trackmeta"><strong id="miniTitle">Nothing playing</strong><small id="miniArtist">Choose a track</small></div>
  <button id="miniPlay" aria-label="Play or pause">▶</button><button id="miniNext" aria-label="Next track">›</button><div class="mini-progress"><i id="miniProgress"></i></div>
</div>
<nav class="nav" aria-label="Main navigation">
  <button data-page="home" class="active"><b>⌂</b>Home</button><button data-page="search"><b>⌕</b>Search</button><button data-page="library"><b>▤</b>Library</button><button data-page="playlists"><b>♫</b>Playlists</button>
</nav>
<section class="playerpage" id="playerPage" aria-label="Now playing">
 <div class="playerbar"><button class="iconbtn" id="closePlayer">⌄</button><span class="eyebrow">NOW PLAYING</span><button class="iconbtn" id="playerMore">•••</button></div>
 <div class="cover playerart" id="playerArt">♫</div>
 <div class="playerinfo"><div class="trackmeta"><strong id="playerTitle">No track selected</strong><small id="playerArtist">Import music to begin</small></div><button class="iconbtn" id="playerLike">♡</button></div>
 <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
 <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
 <div class="controls"><button class="iconbtn" id="shuffle" aria-label="Shuffle">⤨</button><button class="iconbtn" id="previous" aria-label="Previous">|‹</button><button class="play" id="bigPlay" aria-label="Play">▶</button><button class="iconbtn" id="next" aria-label="Next">›|</button><button class="iconbtn" id="repeat" aria-label="Repeat">↻</button></div>
 <div class="volume"><span>◖</span><input id="volume" type="range" min="0" max="1" step=".01" value=".85"><span>◗</span></div>
 <div style="display:flex;justify-content:space-between;margin-top:24px"><button class="secondary" id="downloadTrack">↓ Save offline</button><span class="subtle" id="offlineNote">Local files stay on this device</span></div>
</section>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>
<input id="filePicker" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.opus" multiple class="hidden">
<script>
(()=> {
'use strict';
const DB_NAME='vybe-db', DB_VERSION=1, STORE='tracks';
let db, tracks=[], playlists=[], favorites=new Set(), currentId=null, currentObjectUrl=null;
let currentPage='home', searchTerm='', libraryTab='Songs', shuffleOn=false, repeatMode=0, currentQueue=[], toastTimer;
const audio=document.getElementById('audio');
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=t=>{if(!Number.isFinite(t)||t<0)return'0:00';return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let result;try{result=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(result?.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function loadData(){const all=await tx('readonly',s=>s.getAll());tracks=all||[];playlists=JSON.parse(localStorage.getItem('vybe_playlists')||'[]');favorites=new Set(JSON.parse(localStorage.getItem('vybe_favorites')||'[]'));const rec=JSON.parse(localStorage.getItem('vybe_recent')||'[]');tracks.sort((a,b)=>(b.added||0)-(a.added||0));return rec}
function saveLists(){localStorage.setItem('vybe_playlists',JSON.stringify(playlists));localStorage.setItem('vybe_favorites',JSON.stringify([...favorites]))}
function recent(){return JSON.parse(localStorage.getItem('vybe_recent')||'[]')}
function addRecent(id){let r=recent().filter(x=>x!==id);r.unshift(id);localStorage.setItem('vybe_recent',JSON.stringify(r.slice(0,30)))}
function byId(id){return tracks.find(t=>t.id===id)}
function artMarkup(t,cls='cover'){return `<div class="${cls}" style="${t?.color?'background:'+t.color:''}">${t?.art?`<img src="${escapeHTML(t.art)}" alt="">`:'♫'}</div>`}
function trackRow(t){return `<div class="trackrow" data-track="${t.id}">${artMarkup(t)}<div class="trackmeta"><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(t.artist||'Unknown artist')} · ${escapeHTML(t.album||'Local file')}</small></div><button class="iconbtn ${favorites.has(t.id)?'active':''}" data-like="${t.id}" aria-label="Favorite">${favorites.has(t.id)?'♥':'♡'}</button><button class="iconbtn" data-more="${t.id}" aria-label="More options">•••</button></div>`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="big">${icon}</div><strong>${title}</strong><p>${desc}</p>${button}</div>`}
function pageHeader(title,action=''){return `<div class="pagehead"><h1>${title}</h1>${action}</div>`}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
 const v=$('view');
 if(currentPage==='home')v.innerHTML=homePage();
 if(currentPage==='search')v.innerHTML=searchPage();
 if(currentPage==='library')v.innerHTML=libraryPage();
 if(currentPage==='playlists')v.innerHTML=playlistsPage();
 updateMini();
}
function homePage(){
 const rec=recent().map(byId).filter(Boolean).slice(0,5);
 const fav=[...favorites].map(byId).filter(Boolean).slice(0,8);
 return `<div class="eyebrow">YOUR SOUND. YOUR SPACE.</div><h1 class="hello">Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}.</h1>
 <div class="hero"><div><div class="eyebrow">WELCOME TO VYBE</div><h2>Music that moves with you.</h2><p class="subtle">Your personal library, beautifully in sync.</p><button class="pill" id="heroImport">＋ Import your music</button></div></div>
 <section class="section"><div class="sectionhead"><h2>Quick picks</h2><span class="subtle">${tracks.length} tracks</span></div><div class="quickgrid">${(rec.length?rec.slice(0,4):fav.slice(0,4)).map(t=>`<button class="quick" data-play="${t.id}">${artMarkup(t)}<span>${escapeHTML(t.title)}</span></button>`).join('')||`<button class="quick" id="quickImport">${artMarkup(null)}<span>Import your first song</span></button>`}</div></section>
 <section class="section"><div class="sectionhead"><h2>Recently played</h2><button class="linkbtn" data-goto="library">See all</button></div><div class="rowlist">${rec.length?rec.slice(0,5).map(trackRow).join(''):empty('◷','Nothing played yet','Play an imported track and it will appear here.')}</div></section>
 <section class="section"><div class="sectionhead"><h2>Your favourites</h2><button class="linkbtn" data-goto="library">See all</button></div><div class="cards">${fav.length?fav.map(t=>`<button class="album" data-play="${t.id}">${artMarkup(t)}<strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(t.artist||'Unknown artist')}</small></button>`).join(''):empty('♡','Build your collection','Tap the heart on any track to save it.')}</div></section>
 <section class="section"><div class="sectionhead"><h2>Made by you</h2><button class="linkbtn" data-goto="playlists">All playlists</button></div><div class="cards">${playlists.length?playlists.map(p=>`<button class="album" data-playlist="${p.id}"><div class="cover" style="background:linear-gradient(135deg,#4c1d95,#171323)">♫</div><strong>${escapeHTML(p.name)}</strong><small>${p.ids.length} songs</small></button>`).join(''):empty('♫','Your playlists start here','Create a playlist for every mood.')}</div></section>
 <section class="section"><div class="sectionhead"><h2>Try a sample</h2><span class="subtle">Online demo</span></div><div class="quick" style="width:100%"><div class="cover" style="width:48px;height:48px">♫</div><div class="trackmeta"><strong>SoundHelix Song 1</strong><small>Demo audio · T. Schürger</small></div><button class="secondary" id="demoPlay">Play</button></div><p class="subtle">Requires internet. Credit: “SoundHelix Song 1 by T. Schürger (soundhelix.com)”.</p></section>`;
}
function searchPage(){const q=searchTerm.toLowerCase();const found=tracks.filter(t=>[t.title,t.artist,t.album].join(' ').toLowerCase().includes(q));const pls=playlists.filter(p=>p.name.toLowerCase().includes(q));return `${pageHeader('Search')}<div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="Songs, artists, albums..." value="${escapeHTML(searchTerm)}"></div><div class="sectionhead"><h2>${q?'Results':'Your music'}</h2><span class="subtle">${q?found.length+' tracks':''}</span></div>${q?(found.length?`<div class="rowlist">${found.map(trackRow).join('')}</div>`:empty('⌕','No matches','Try another title, artist or album.'))+ (pls.length?`<h3>Playlists</h3>${pls.map(p=>`<button class="quick" data-playlist="${p.id}">${artMarkup(null)}<span>${escapeHTML(p.name)}</span></button>`).join('')}`:''):empty('⌕','Find your next favourite','Search the music you have imported into VYBE.')}`}
function libraryPage(){let list=tracks;if(libraryTab==='Liked')list=tracks.filter(t=>favorites.has(t.id));if(libraryTab==='Recent')list=recent().map(byId).filter(Boolean);if(libraryTab==='Albums'){const seen=new Set();list=tracks.filter(t=>{const k=t.album||'Unknown album';if(seen.has(k))return false;seen.add(k);return true})}if(libraryTab==='Artists'){const seen=new Set();list=tracks.filter(t=>{const k=t.artist||'Unknown artist';if(seen.has(k))return false;seen.add(k);return true})}return `${pageHeader('Your Library',`<button class="primary" id="importBtn">＋ Add</button>`)}<div class="tabs">${['Songs','Liked','Albums','Artists','Recent'].map(x=>`<button class="chip ${libraryTab===x?'active':''}" data-tab="${x}">${x}</button>`).join('')}</div>${list.length?`<div class="rowlist">${list.map(trackRow).join('')}</div>`:empty('♫',libraryTab==='Liked'?'No favourites yet':'Your library is empty','Import audio files from the Files app to start listening.',`<button class="primary" id="emptyImport">Import music</button>`)}`}
function playlistsPage(){return `${pageHeader('Playlists',`<button class="primary" id="newPlaylist">＋ Create</button>`)}<p class="subtle">Make a soundtrack for every moment.</p>${playlists.length?`<div class="rowlist">${playlists.map(p=>`<div class="trackrow"><div class="cover" style="width:48px;height:48px">♫</div><div class="trackmeta"><strong>${escapeHTML(p.name)}</strong><small>${p.ids.length} songs</small></div><button class="iconbtn" data-openlist="${p.id}">›</button><button class="iconbtn" data-editlist="${p.id}">•••</button></div>`).join('')}</div>`:empty('♫','No playlists yet','Create your first playlist and add tracks from your library.',`<button class="primary" id="emptyPlaylist">Create playlist</button>`)}<section class="section"><div class="sectionhead"><h2>Bring your playlists</h2></div><p class="subtle">VYBE cannot directly access Spotify or Apple Music accounts. You can recreate playlists here or import a VYBE playlist backup (JSON).</p><button class="secondary" id="importPlaylist">Import playlist backup</button><button class="secondary" id="exportPlaylist" style="margin-left:7px">Export backup</button></section>`}
function setPage(p){currentPage=p;render();window.scrollTo(0,0)}
function openImport(){ $('filePicker').click() }
async function importFiles(files){if(!files?.length)return;let count=0;for(const f of [...files]){if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|aac|flac|ogg|opus|aiff?)$/i.test(f.name))continue;const title=f.name.replace(/\.[^.]+$/,'');const t={id:uid(),title,artist:'Unknown artist',album:'Local file',name:f.name,type:f.type,blob:f,added:Date.now(),size:f.size};await tx('readwrite',s=>s.put(t));count++}await loadData();render();toast(count?`${count} track${count===1?'':'s'} imported`:'No supported audio files found');$('filePicker').value=''}
async function playTrack(id,queue){const t=byId(id);if(!t)return;currentId=id;if(queue)currentQueue=queue;else currentQueue=tracks.map(x=>x.id);if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}if(t.blob){currentObjectUrl=URL.createObjectURL(t.blob);audio.src=currentObjectUrl}else if(t.url){audio.src=t.url}else return;addRecent(id);try{await audio.play();}catch(e){toast('Tap Play to start audio')}updatePlayer();render()}
async function playDemo(){const demo={id:'__demo__',title:'SoundHelix Song 1',artist:'T. Schürger',album:'Demo audio',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',color:'linear-gradient(135deg,#5b21b6,#111)' };tracks.push(demo);currentQueue=[demo.id];await playTrack(demo.id,currentQueue)}
function currentTrack(){return byId(currentId)}
function updatePlayer(){const t=currentTrack();if(!t)return;$('playerTitle').textContent=t.title;$('playerArtist').textContent=t.artist||'Unknown artist';$('playerArt').innerHTML=t.art?`<img src="${escapeHTML(t.art)}" alt="">`:'♫';$('playerLike').textContent=favorites.has(t.id)?'♥':'♡';$('playerLike').classList.toggle('active',favorites.has(t.id));$('bigPlay').textContent=audio.paused?'▶':'Ⅱ';$('miniPlay').textContent=audio.paused?'▶':'Ⅱ';$('offlineNote').textContent=t.blob?'Saved on this device':'Online demo · not saved';$('miniTitle').textContent=t.title;$('miniArtist').textContent=t.artist||'Unknown artist';$('miniArt').innerHTML=t.art?`<img src="${escapeHTML(t.art)}" alt="">`:'♫';$('miniPlayer').classList.remove('hidden');$('shuffle').classList.toggle('active',shuffleOn);$('repeat').classList.toggle('active',repeatMode>0);$('repeat').textContent=repeatMode===2?'↻¹':'↻'}
function updateMini(){if(currentId&&currentTrack())updatePlayer();else $('miniPlayer').classList.add('hidden')}
function togglePlay(){if(!currentId){if(tracks.length)playTrack(tracks[0].id);else toast('Import music first');return}if(audio.paused)audio.play().catch(()=>toast('Audio could not be played'));else audio.pause();updatePlayer()}
function nextTrack(){if(!currentQueue.length)return;let idx=currentQueue.indexOf(currentId);let next;if(shuffleOn){const choices=currentQueue.filter(x=>x!==currentId);next=choices[Math.floor(Math.random()*choices.length)]}else next=currentQueue[(idx+1)%currentQueue.length];if(next)playTrack(next,currentQueue)}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return}let idx=currentQueue.indexOf(currentId);let prev=currentQueue[(idx-1+currentQueue.length)%currentQueue.length];if(prev)playTrack(prev,currentQueue)}
function toggleLike(id=currentId){if(!id)return;if(favorites.has(id))favorites.delete(id);else favorites.add(id);saveLists();render();updatePlayer()}
function openPlayer(){if(!currentId){toast('Choose a track first');return}$('playerPage').classList.add('open');updatePlayer()}
function closePlayer(){$('playerPage').classList.remove('open')}
function showModal(content){$('modal').innerHTML=content;$('modalBack').classList.add('open')}
function closeModal(){$('modalBack').classList.remove('open')}
function createPlaylist(name){name=name.trim();if(!name)return;playlists.push({id:uid(),name,ids:[]});saveLists();closeModal();render();toast('Playlist created')}
function playlistModal(id){const p=playlists.find(x=>x.id===id);if(!p)return;showModal(`<h2>${escapeHTML(p.name)}</h2><input class="field" id="renameInput" value="${escapeHTML(p.name)}" aria-label="Playlist name"><button class="primary" id="renameSave">Save name</button><h3 style="margin-top:22px">Add songs</h3><div class="rowlist">${tracks.filter(t=>!p.ids.includes(t.id)).map(t=>`<div class="trackrow">${artMarkup(t)}<div class="trackmeta"><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(t.artist||'Unknown artist')}</small></div><button class="secondary" data-addsong="${t.id}" data-to="${p.id}">＋ Add</button></div>`).join('')||'<p class="subtle">All your tracks are already in this playlist.</p>'}</div><button class="secondary danger" id="deletePlaylist" style="margin-top:18px">Delete playlist</button>`);$('renameSave').onclick=()=>{const n=$('renameInput').value.trim();if(n){p.name=n;saveLists();closeModal();render()}};$('deletePlaylist').onclick=()=>{if(confirm('Delete this playlist?')){playlists=playlists.filter(x=>x.id!==id);saveLists();closeModal();render()}}}
function openPlaylist(id){const p=playlists.find(x=>x.id===id);if(!p)return;const list=p.ids.map(byId).filter(Boolean);currentQueue=list.map(t=>t.id);showModal(`<h2>${escapeHTML(p.name)}</h2><p class="subtle">${list.length} songs</p><div class="rowlist">${list.map(t=>`<div class="trackrow">${artMarkup(t)}<div class="trackmeta"><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(t.artist||'Unknown artist')}</small></div><button class="iconbtn" data-play="${t.id}">▶</button><button class="iconbtn danger" data-remove="${t.id}" data-from="${id}">−</button></div>`).join('')||'<p class="subtle">This playlist is empty. Add songs from the playlist menu.</p>'}</div><button class="secondary" id="editThisPlaylist" style="margin-top:15px">Edit playlist</button>`);$('editThisPlaylist').onclick=()=>playlistModal(id)}
async function downloadCurrent(){const t=currentTrack();if(!t)return;if(t.blob){toast('Already saved offline on this device');return}if(t.url){try{toast('Saving audio for offline use…');const res=await fetch(t.url);if(!res.ok)throw Error('Download failed');const blob=await res.blob();t.blob=blob;t.name=(t.title||'audio')+'.mp3';t.size=blob.size;t.url=null;await tx('readwrite',s=>s.put(t));render();updatePlayer();toast('Saved offline on this device')}catch(e){toast('Could not save this stream. It may block downloads.')}}}
function exportPlaylists(){const payload={app:'VYBE',version:1,playlists};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='vybe-playlists.json';a.click();URL.revokeObjectURL(u)}
async function importPlaylistBackup(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.playlists))throw Error('Invalid backup');playlists.push(...data.playlists.map(p=>({id:uid(),name:String(p.name||'Imported playlist'),ids:(p.ids||[]).filter(id=>byId(id))})));saveLists();render();toast('Playlist backup imported')}catch(e){toast('Could not read that playlist backup')}}
function settings(){showModal(`<h2>Settings</h2><div class="settingsrow"><div><strong>Appearance</strong><small>VYBE uses its midnight violet theme</small></div><select id="themeSelect"><option value="dark">Midnight</option><option value="light">Light (coming soon)</option></select></div><div class="settingsrow"><div><strong>Audio</strong><small>Playback volume and controls</small></div><span class="subtle">Device audio</span></div><div class="settingsrow"><div><strong>Local storage</strong><small>${tracks.filter(t=>t.blob).length} imported tracks saved in this browser</small></div><button class="secondary danger" id="clearLibrary">Clear</button></div><div class="settingsrow"><div><strong>About VYBE</strong><small>Private music player · Version 1.0</small></div><span class="subtle">♫</span></div><p class="subtle">Your imported audio and playlists stay in this browser's local storage. They are not uploaded to VYBE servers.</p>`);$('clearLibrary').onclick=async()=>{if(confirm('Delete all imported music, favourites and playlists from this browser?')){audio.pause();audio.removeAttribute('src');audio.load();currentId=null;if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null;await tx('readwrite',s=>s.clear());tracks=[];playlists=[];favorites.clear();localStorage.removeItem('vybe_playlists');localStorage.removeItem('vybe_favorites');localStorage.removeItem('vybe_recent');closeModal();render();toast('Local library cleared')}}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){setPage(b.dataset.page);return}
 if(b.dataset.goto){setPage(b.dataset.goto);return}
 if(b.dataset.tab){libraryTab=b.dataset.tab;render();return}
 if(b.dataset.play){const id=b.dataset.play;closeModal();playTrack(id);return}
 if(b.dataset.playlist){openPlaylist(b.dataset.playlist);return}
 if(b.dataset.openlist){openPlaylist(b.dataset.openlist);return}
 if(b.dataset.editlist){playlistModal(b.dataset.editlist);return}
 if(b.dataset.like){toggleLike(b.dataset.like);return}
 if(b.dataset.more){const t=byId(b.dataset.more);if(t)showModal(`<h2>${escapeHTML(t.title)}</h2><button class="secondary" id="moreFav">${favorites.has(t.id)?'Remove from':'Add to'} favourites</button><button class="secondary" id="morePlaylist" style="margin-left:8px">Add to playlist</button><button class="secondary" id="moreDownload" style="margin-left:8px">Download</button>`);$('moreFav').onclick=()=>{toggleLike(t.id);closeModal()};$('morePlaylist').onclick=()=>{closeModal();if(!playlists.length){showModal('<h2>Create a playlist first</h2>')}else showModal(`<h2>Add to playlist</h2>${playlists.map(p=>`<button class="quick" data-addsong="${t.id}" data-to="${p.id}">${escapeHTML(p.name)}</button>`).join('')}`)};$('moreDownload').onclick=()=>{currentId=t.id;downloadCurrent();closeModal()};return}
 if(b.dataset.addsong){const p=playlists.find(x=>x.id===b.dataset.to);if(p&&!p.ids.includes(b.dataset.addsong)){p.ids.push(b.dataset.addsong);saveLists();toast('Added to playlist');if($('modalBack').classList.contains('open'))playlistModal(p.id)}return}
 if(b.dataset.remove){const p=playlists.find(x=>x.id===b.dataset.from);if(p){p.ids=p.ids.filter(x=>x!==b.dataset.remove);saveLists();openPlaylist(p.id)}return}
 if(b.id==='settingsAvatar'){settings();return}
 if(b.id==='importBtn'||b.id==='emptyImport'||b.id==='heroImport'||b.id==='quickImport'){openImport();return}
 if(b.id==='newPlaylist'||b.id==='emptyPlaylist'){showModal('<h2>Create playlist</h2><input class="field" id="newPlaylistName" placeholder="Give it a name" maxlength="50"><button class="primary" id="createPlaylistBtn">Create</button>');$('createPlaylistBtn').onclick=()=>createPlaylist($('newPlaylistName').value);return}
 if(b.id==='demoPlay'){playDemo();return}
 if(b.id==='miniPlayer'){openPlayer();return}
 if(b.id==='playerMore'){toast('Use the library menu for track options');return}
 if(b.id==='importPlaylist'){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=()=>i.files[0]&&importPlaylistBackup(i.files[0]);i.click();return}
 if(b.id==='exportPlaylist'){exportPlaylists();return}
});
$('miniPlayer').addEventListener('click',e=>{if(e.target.closest('button'))return;openPlayer()});
$('filePicker').addEventListener('change',e=>importFiles(e.target.files));
$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});
$('bigPlay').addEventListener('click',togglePlay);
$('miniPlay').addEventListener('click',togglePlay);
$('miniNext').addEventListener('click',nextTrack);
$('next').addEventListener('click',nextTrack);
$('previous').addEventListener('click',prevTrack);
$('shuffle').addEventListener('click',()=>{shuffleOn=!shuffleOn;updatePlayer()});
$('repeat').addEventListener('click',()=>{repeatMode=(repeatMode+1)%3;updatePlayer()});
$('playerLike').addEventListener('click',()=>toggleLike());
$('downloadTrack').addEventListener('click',downloadCurrent);
$('closePlayer').addEventListener('click',closePlayer);
$('seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration))audio.currentTime=(Number(e.target.value)/1000)*audio.duration});
$('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));
audio.volume=.85;
audio.addEventListener('timeupdate',()=>{const pct=audio.duration?audio.currentTime/audio.duration:0;$('seek').value=Math.round(pct*1000);$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);$('miniProgress').style.width=(pct*100)+'%'});
audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(audio.duration)});
audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);
audio.addEventListener('ended',()=>{if(repeatMode===2){audio.currentTime=0;audio.play()}else if(repeatMode===1){nextTrack()}else if(currentQueue.indexOf(currentId)<currentQueue.length-1)nextTrack();else updatePlayer()});
audio.addEventListener('error',()=>toast('Audio could not be loaded. Check the file or connection.'));
$('view').addEventListener('input',e=>{if(e.target.id==='searchInput'){searchTerm=e.target.value;const pos=e.target.selectionStart;render();const inp=$('searchInput');inp.focus();inp.setSelectionRange(pos,pos)}});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
(async()=>{try{db=await openDB();await loadData();render()}catch(e){console.error(e);$('view').innerHTML=empty('!','Storage unavailable','Please open VYBE in Safari and allow website storage.')}})();
})();
</script>
</body></html>
